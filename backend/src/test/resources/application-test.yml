spring:
  datasource:
    url: jdbc:tc:postgresql:15:///
    username: ""
    password: ""

  flyway:
    default-schema: public
    schemas: public
    locations:
      - classpath:db/test_migrations
      - classpath:db/migration
    baseline-version: 0.0

springdoc:
  use-fqn: false

hangar:
  disable-ratelimiting: true
  # Tests reindex synchronously via SchedulerService#runAllJobs in TestData; keep the async job
  # poller from firing during the run, or its concurrent reindex empties the live index.
  jobs:
    check-interval: 24h
  storage:
    type: "local"
  security:
    turnstile-secret: ""
  meili:
    url: "http://localhost:8800"
    key: "masterKey"
    prefix: "test-"
